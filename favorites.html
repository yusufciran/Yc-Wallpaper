<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beğenilenler - Yc Wallpaper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="favorites-page">
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content detail-header-new">
                <div class="header-left-section">
                    <a href="index.html" class="back-btn-detail">
                        ← Geri Dön
                    </a>
                </div>
                <div class="header-right-section">
                    <a href="index.html" class="logo">
                        <span class="logo-icon">YC</span>
                        <span class="logo-text">WALLPAPER</span>
                    </a>
                    <a href="favorites.html" class="favorites-link-small active">
                        <span class="favorites-icon">❤️</span>
                        <span class="favorites-count" id="favorites-count">0</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Favorites Content -->
    <section class="favorites-section">
        <div class="container">
            <div class="favorites-header">
                <h1 class="favorites-title">Beğenilen Duvar Kağıtları</h1>
                <button class="clear-favorites-btn" id="clear-favorites-btn">
                    Tümünü Temizle
                </button>
            </div>

            <div class="favorites-grid" id="favorites-grid">
                <!-- Favorites will be loaded here -->
            </div>

            <div class="empty-favorites" id="empty-favorites" style="display: none;">
                <div class="empty-icon">💔</div>
                <h2>Henüz beğenilen duvar kağıdı yok</h2>
                <p>Beğendiğiniz duvar kağıtlarını kalp butonuna tıklayarak buraya ekleyebilirsiniz.</p>
                <a href="index.html" class="btn-primary">Duvar Kağıtlarına Göz At</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 Yc Wallpaper. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
